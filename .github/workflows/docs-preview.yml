name: Docs preview (zensical)

on:
  push:
    branches: [docs/zensical-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install docs deps
        run: |
          uv venv
          uv pip install -r docs/requirements.txt
          uv pip install -e .
      - name: Convert notebooks
        # The checkout is detached, so tell the converter which ref the GitHub
        # links on the generated pages (edit/view buttons included) should
        # point at - otherwise they resolve against main, where a notebook
        # added or renamed on this branch does not exist yet.
        env:
          DOCS_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: uv run python docs/convert_notebooks.py
      - name: Build site
        run: uv run zensical build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
